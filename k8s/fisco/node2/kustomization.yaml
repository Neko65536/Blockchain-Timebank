apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: fisco2-
resources: [../../fisco-node]
labels:
  - pairs: {fisco-node: node2}
    includeSelectors: true
    includeTemplates: true
patches:
  - target: {kind: StatefulSet, name: node}
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/secret/secretName
        value: fisco-node2
