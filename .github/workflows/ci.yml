name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (JDK 21 + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B -ntp -f backend/pom.xml -pl timecoin-web -am test

  frontend:
    name: Frontend (phone + pc build, lint & test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [phone, pc]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-system/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: vue-system/${{ matrix.app }}
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: vue-system/${{ matrix.app }}
        run: npm run lint -- --no-fix
      - name: Unit test
        working-directory: vue-system/${{ matrix.app }}
        run: npm run test --if-present
      - name: Build
        working-directory: vue-system/${{ matrix.app }}
        run: npm run build

  dependency-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (frontend, high+)
        working-directory: vue-system/phone
        run: npm audit --omit=dev --audit-level=high || true
      - name: npm audit (pc, high+)
        working-directory: vue-system/pc
        run: npm audit --omit=dev --audit-level=high || true
